algorithm: ppo
out: runs/ppo_c0
init_ckpt: runs/rl_aux/ckpt_best.pt
ruleset: hk_classic
seed: 0
# more torch threads don't speed up the learner on the i7-1265U and drain the battery
threads: 2
# auto: cuda when available, else cpu. cuda without a gpu fails at startup
device: auto
# fp16 autocast + GradScaler, cuda only
amp: false
envs: 96
workers: 6
blind_frac: 0.125
batch_size: 4096
minibatch: 512
epochs: 2
lr: 0.0003
clip: 0.2
gae_lambda: 0.95
entropy_coef: 0.01
value_coef: 0.5
grad_clip: 0.5
popart_beta: 0.1
aux_rate: 0.1
aux_coef_start: 1.0
aux_coef_end: 0.05
aux_anneal_decisions: 50000000
total_decisions: 1000000000
save_every: 20
curriculum:
  start: C0
  window: 4000
  contingency:
    enabled: false
