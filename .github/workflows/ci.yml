name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# one run per ref; a newer PR push cancels the old run, main pushes queue instead
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three independent domains (server, web, proto-check) with no shared artifact and no
# genuine precondition between them -- each `uses:` job below runs in parallel with no
# `needs:`. (Within server.yml/web.yml, lint+typecheck+test *within* a language are also
# independent of each other's output, but are kept as sequential steps in one job rather
# than separate jobs, to reuse a single dependency install instead of paying for it 2-3x.)
jobs:
  server:
    name: server
    uses: ./.github/workflows/server.yml

  web:
    name: web
    uses: ./.github/workflows/web.yml

  proto-check:
    name: proto-check
    uses: ./.github/workflows/proto-check.yml

  # the prod box deploys whatever passes this workflow; an unparseable overlay only fails there
  compose-config:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: parse the prod compose stack
        env:
          TRUSTED_PROXY_IPS: 127.0.0.1
          JWT_SECRET: ci
          CORS_ORIGINS: http://localhost
          PUBLIC_API_URL: http://localhost:8000
          PUBLIC_WS_URL: ws://localhost:8000/ws
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  # badges live on an orphan `badges` branch, force-pushed as one commit, so main never gets
  # bot commits; self-rendered because shields.io can't fetch from a private repo.
  coverage-badge:
    name: coverage badge
    needs: [server, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      # a missing report keeps that badge's previous svg instead of failing the run
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: coverage-server
          path: coverage-server
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: coverage-web
          path: coverage-web
      - name: generate badge SVGs
        run: |
          mkdir badges-out
          if git fetch --depth=1 origin badges; then
            git --work-tree=badges-out checkout FETCH_HEAD -- .
            git reset -q
          fi
          cp -r badges-out badges-prev
          python3 .github/scripts/coverage_badge.py server "server coverage" coverage-server/coverage.json badges-out/coverage-server.svg
          python3 .github/scripts/coverage_badge.py web "web coverage" coverage-web/coverage-summary.json badges-out/coverage-web.svg
      # the `badges` ruleset blocks updates; only its deploy-key bypass can push (docs/infra.md §9).
      - name: force-push badges branch if changed
        env:
          BADGES_DEPLOY_KEY: ${{ secrets.BADGES_DEPLOY_KEY }}
        run: |
          diff -r badges-prev badges-out >/dev/null && exit 0
          if [ -z "$BADGES_DEPLOY_KEY" ]; then
            echo "::error::BADGES_DEPLOY_KEY secret is not set (docs/infra.md §9)"
            exit 1
          fi
          key="$RUNNER_TEMP/badges_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$BADGES_DEPLOY_KEY" > "$key"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan badges-tmp
          git rm -rq --cached .
          cp badges-out/*.svg .
          git add coverage-*.svg
          git commit -qm "chore(ci): update coverage badges"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push --force "git@github.com:${{ github.repository }}.git" HEAD:badges
