name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Three independent domains (server, web, proto-check) with no shared artifact and no
# genuine precondition between them -- each `uses:` job below runs in parallel with no
# `needs:`. (Within server.yml/web.yml, lint+typecheck+test *within* a language are also
# independent of each other's output, but are kept as sequential steps in one job rather
# than separate jobs, to reuse a single dependency install instead of paying for it 2-3x.)
jobs:
  server:
    name: server
    uses: ./.github/workflows/server.yml

  web:
    name: web
    uses: ./.github/workflows/web.yml

  proto-check:
    name: proto-check
    uses: ./.github/workflows/proto-check.yml

  # Pushes updated coverage-badge SVGs back to main, self-rendered rather than shields.io's own
  # endpoint badge -- this repo is private, and shields.io's anonymous fetch of
  # raw.githubusercontent.com 401s on a private repo, so an externally-hosted badge would never
  # resolve. README references these by relative path; GitHub renders that straight from the
  # repo for any authenticated viewer, no external fetch involved. Only on push, never on a PR
  # -- forked PRs have no write access, and a PR branch shouldn't mutate main anyway.
  # GITHUB_TOKEN-authored pushes don't retrigger workflow runs, so this can't loop.
  coverage-badge:
    name: coverage badge
    needs: [server, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: coverage-server
          path: coverage-server
      - uses: actions/download-artifact@v4
        with:
          name: coverage-web
          path: coverage-web
      - name: generate badge SVGs
        run: |
          python3 .github/scripts/coverage_badge.py server "server coverage" coverage-server/coverage.json .github/badges/coverage-server.svg
          python3 .github/scripts/coverage_badge.py web "web coverage" coverage-web/coverage-summary.json .github/badges/coverage-web.svg
      - name: commit badge SVGs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage-server.svg .github/badges/coverage-web.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore(ci): update coverage badges"
          git push
