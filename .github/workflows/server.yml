name: server

on:
  workflow_call:

jobs:
  server:
    name: lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # one job, sequential steps sharing the synced venv -- lint/test have no dependency on
      # each other's *output*, but splitting them into separate jobs would mean paying
      # `uv sync` twice (or plumbing an artifact between jobs) for no real gain.
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: pytest
        run: uv run pytest -q -m fast -n auto

  server-slow:
    name: slow tests (soaks, real-bot e2e, hypothesis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # a separate job, not a step tacked onto `server` above: no shared artifact/output with
      # the fast job (same reasoning root ci.yml already applies to server/web/proto-check), so
      # running it in parallel costs one extra `uv sync` instead of adding to the fast job's own
      # critical path -- the whole point of never skipping this suite is that it stops being a
      # tax on the fast feedback loop everyone waits on per push.
      # --games caps the self-play soak (default 10000 -- ~16 min, docs/05-roadmap.md §2) to a
      # size that fits a per-push job; `make test-server-slow`/`make selfplay` still default to
      # the full 10000 locally.
      - name: pytest (slow)
        run: uv run pytest -q -m slow -n auto --games=1000
