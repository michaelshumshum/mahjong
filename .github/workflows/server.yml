name: server

on:
  workflow_call:

jobs:
  server:
    name: lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # one job, sequential steps sharing the synced venv -- lint/test have no dependency on
      # each other's *output*, but splitting them into separate jobs would mean paying
      # `uv sync` twice (or plumbing an artifact between jobs) for no real gain.
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: pytest
        run: uv run pytest -q -m "not slow"
