name: server

on:
  workflow_call:

jobs:
  server:
    name: lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # one job, sequential steps sharing the synced venv -- lint/test have no dependency on
      # each other's *output*, but splitting them into separate jobs would mean paying
      # `uv sync` twice (or plumbing an artifact between jobs) for no real gain.
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: pytest
        run: uv run pytest -q -m fast -n auto
      # Separate rerun, not folded into the hard gate above: coverage.py's line tracing adds
      # enough overhead to trip test_frontier_cache_warms_and_stays_fast's wall-clock ceiling
      # (a real cache-performance assertion, not a flaky test) -- deselected here since the
      # step above already exercised it for correctness. continue-on-error because this step
      # exists only to produce the coverage-badge artifact; it must never fail the job.
      - name: pytest (coverage, informational)
        continue-on-error: true
        run: >
          uv run pytest -q -m fast -n auto
          --deselect tests/test_shanten.py::test_frontier_cache_warms_and_stays_fast
          --cov=mahjong_core --cov=app --cov=bots --cov-report=json:coverage.json
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-server
          path: server/coverage.json
          if-no-files-found: ignore
          retention-days: 1

  server-slow:
    name: slow tests (soaks, real-bot e2e, hypothesis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # a separate job, not a step tacked onto `server` above: no shared artifact/output with
      # the fast job (same reasoning root ci.yml already applies to server/web/proto-check), so
      # running it in parallel costs one extra `uv sync` instead of adding to the fast job's own
      # critical path -- the whole point of never skipping this suite is that it stops being a
      # tax on the fast feedback loop everyone waits on per push.
      # --games caps the self-play soak (default 10000 -- ~16 min, docs/testing.md §1) to a
      # size that fits a per-push job; `make test-server-slow`/`make selfplay` still default to
      # the full 10000 locally.
      - name: pytest (slow)
        run: uv run pytest -q -m slow -n auto --games=1000

  # the test suites run on sqlite (create_all), so only this job runs the alembic migrations
  # the prod box applies (`make prod-migrate`), against the same postgres as docker-compose.yml
  migrations:
    name: migrations (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mahjong
          POSTGRES_PASSWORD: mahjong
          POSTGRES_DB: mahjong
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mahjong -d mahjong"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://mahjong:mahjong@localhost:5432/mahjong
      PGURL: postgresql://mahjong:mahjong@localhost:5432/mahjong
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: upgrade head
        run: uv run alembic upgrade head
      # models and migrations agree: no autogenerate diff
      - name: alembic check
        run: uv run alembic check
      - name: downgrade base
        run: uv run alembic downgrade base
      - name: nothing left after downgrade
        run: |
          left=$(psql "$PGURL" -tAc "select string_agg(tablename, ',') from pg_tables
            where schemaname = 'public' and tablename <> 'alembic_version'")
          if [ -n "$left" ]; then
            echo "::error::downgrade base left tables: $left"
            exit 1
          fi
      - name: upgrade head again
        run: uv run alembic upgrade head
