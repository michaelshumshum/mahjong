name: docker-build

# Standalone, not one of ci.yml's reusable workflows: workflow_call has no path-filter
# mechanism of its own (docs/infra.md §9), and nothing else in CI ever builds these
# images — server.yml/web.yml run tests natively via uv/pnpm, not through Compose. Gated on
# paths so it only runs when a Dockerfile, lockfile, or Compose file actually changed.
on:
  push:
    branches: [main]
    paths:
      - "server/Dockerfile"
      - "server/pyproject.toml"
      - "server/uv.lock"
      - "web/Dockerfile"
      - "web/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/Dockerfile"
      - "server/pyproject.toml"
      - "server/uv.lock"
      - "web/Dockerfile"
      - "web/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server dev
            context: ./server
            dockerfile: server/Dockerfile
            target: dev
          - name: server prod
            context: ./server
            dockerfile: server/Dockerfile
            target: prod
          - name: web dev
            context: .
            dockerfile: web/Dockerfile
            target: dev
          - name: web prod
            context: .
            dockerfile: web/Dockerfile
            target: prod
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Separate job, not a 5th matrix entry: torch's PyPI wheel bundles full CUDA (nvidia-cublas,
  # cudnn, nccl, triton, ...) even though GPU passthrough is commented out in
  # docker-compose.yml's `trainer` service and GPU training runs natively
  # instead (docs/ml.md §13) — the `ml` target image is 18.6GB. Kept CUDA-ready rather than switching to a
  # CPU-only torch wheel, since GPU training is still the eventual plan; that size just means
  # this stage needs its own disk/cache handling that the matrix's other four (each well under
  # 1GB) don't. Building it as a plain matrix entry with a `type=gha,mode=max` cache export
  # crashed a standard runner outright — the job died mid-step with no clean failure
  # (2026-09-27, run 36332754927) — almost certainly disk exhaustion (~14GB free on a standard
  # runner, less than the image alone) compounded by GHA's cache-blob upload trying to buffer
  # that layer in memory.
  build-server-ml:
    name: build server ml
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # frees ~25-30GB: these preinstalled toolchains (dotnet, Android SDK, GHC, CodeQL) are
      # unused by this job and dwarf the runner's default ~14GB free.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
      - uses: docker/setup-buildx-action@v3
      # cache-to/from target the registry, not `type=gha`: GHCR streams large blobs as a normal
      # OCI push instead of buffering them through the Actions cache-blob API, which is what
      # crashed the runner above on this image's size.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: server/Dockerfile
          target: ml
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/cache:server-ml
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/cache:server-ml,mode=max
