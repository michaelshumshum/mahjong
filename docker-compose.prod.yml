# docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
name: mahjong

services:
  api:
    build:
      target: prod
    # ws frame cap and no permessage-deflate: docs/protocol.md §1
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 1 --limit-concurrency 1000
      --ws-max-size 65536 --ws-per-message-deflate false
      --proxy-headers --forwarded-allow-ips ${TRUSTED_PROXY_IPS:?TRUSTED_PROXY_IPS must be set to the reverse proxy's IP/CIDR}
    environment:
      # app/limits.py reads it too, to trust CF-Connecting-IP (docs/protocol.md §11)
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS}
      WS_MAX_CONNECTIONS_PER_IP: ${WS_MAX_CONNECTIONS_PER_IP:-}
      WS_MAX_SPECTATORS_PER_TABLE: ${WS_MAX_SPECTATORS_PER_TABLE:-}
      WS_MSG_RATE: ${WS_MSG_RATE:-}
      WS_MSG_BURST: ${WS_MSG_BURST:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      API_DOCS: "0"
      # also read by the app: CF-Connecting-IP counts for the POST /tables rate limit only from these
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS}
    # !override: base file publishes 0.0.0.0; only the host-side tunnel connector should reach it
    ports: !override ["127.0.0.1:${API_PORT:-8000}:8000"]
    stop_grace_period: 100s   # > SHUTDOWN_GRACE_SECONDS (90)
    volumes: !reset []
    restart: unless-stopped

  web:
    build:
      target: prod
    command: node build
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set}
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:?PUBLIC_WS_URL must be set}
      PORT: 3000
    # !override, not plain ports: — compose concatenates ports: across -f files
    # rather than replacing them, so a bare list here would keep the dev
    # 5173 mapping alongside this one instead of replacing it.
    ports: !override ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    volumes: !reset []
    restart: unless-stopped

  postgres:
    # !reset, not ports: [] — same concatenation issue; a bare [] leaves the
    # dev file's 5432:5432 mapping in place and republishes postgres to the host.
    ports: !reset []
    restart: unless-stopped
