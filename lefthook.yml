pre-commit:
  parallel: true
  jobs:
    - name: web-lint
      root: "web/"
      glob: "*.{js,ts,svelte}"
      run: pnpm exec oxlint {staged_files}

    - name: web-format
      root: "web/"
      glob: "*.{js,ts,svelte,json,scss,css,md}"
      exclude: "**/AGENTS.md"
      run: pnpm exec oxfmt --check {staged_files}

    - name: web-typecheck
      root: "web/"
      glob: "*.{js,ts,svelte}"
      run: pnpm check

    - name: server-format
      root: "server/"
      glob: "*.py"
      run: uv run ruff format {staged_files}

    - name: server-check
      root: "server/"
      glob: "*.py"
      run: uv run ruff check {staged_files}

    - name: comment-length
      run: python3 scripts/check_comment_length.py

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit $1
