pre-commit:
  parallel: true
  jobs:
    - name: web-lint
      root: "web/"
      glob: "*.{js,ts,svelte}"
      run: pnpm exec oxlint {staged_files}

    - name: web-format
      root: "web/"
      glob: "*.{js,ts,svelte,json,scss,css,md}"
      exclude: "**/AGENTS.md"
      run: pnpm exec oxfmt --check {staged_files}

    - name: web-typecheck
      root: "web/"
      glob: "*.{js,ts,svelte}"
      run: pnpm check

    - name: server-format
      glob: "server/**/*.py"
      run: cd server && uv run ruff format {staged_files}

    - name: server-check
      glob: "server/**/*.py"
      run: cd server && uv run ruff check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit $1
