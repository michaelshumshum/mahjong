name: mahjong

x-pg-env: &pg-env
  POSTGRES_USER: ${POSTGRES_USER:-mahjong}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mahjong}
  POSTGRES_DB: ${POSTGRES_DB:-mahjong}

services:
  postgres:
    container_name: mahjong-postgres
    image: postgres:17-alpine
    environment: *pg-env
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mahjong} -d ${POSTGRES_DB:-mahjong}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: mahjong-api
    build:
      context: ./server
      target: dev
    # one worker only: tables are in-memory, owned by one process. docs/infra.md §3
    # ws frame cap and no permessage-deflate: docs/protocol.md §1
    command: >
      uv run uvicorn app.main:app
      --host 0.0.0.0 --port 8000 --workers 1
      --ws-max-size 65536 --ws-per-message-deflate false
      --reload --reload-dir /app/app --reload-dir /app/mahjong_core
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mahjong}:${POSTGRES_PASSWORD:-mahjong}@postgres:5432/${POSTGRES_DB:-mahjong}
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-secret}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PYTHONPATH: /app
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - ./server:/app
      - ./shared:/shared
      - ./web/src/lib/net:/web-net    # `make proto` writes protocol.d.ts here directly (docs/protocol.md §6)
      - server-venv:/app/.venv        # keeps the container venv off the host mount
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      # "degraded" (learned weights unusable, docs/bots.md §2) still serves but marks the container unhealthy
      test: ["CMD", "python", "-c", "import json,sys,urllib.request;sys.exit(json.load(urllib.request.urlopen('http://localhost:8000/healthz'))['status'] != 'ok')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    container_name: mahjong-web
    build:
      context: .                      # needs root pnpm-workspace.yaml + lockfile
      dockerfile: web/Dockerfile
      target: dev
    command: pnpm dev --host 0.0.0.0 --port 5173
    environment:
      PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
      PUBLIC_WS_URL: ws://localhost:${API_PORT:-8000}/ws
    ports: ["${WEB_PORT:-5173}:5173"]
    volumes:
      - ./web:/app/web
      - ./shared:/shared
      # anonymous, not named: reseeded from the image on every new container, so a dependency
      # change can't leave a stale node_modules masking the rebuilt image's
      - /app/web/node_modules
      - playwright-browsers:/root/.cache/ms-playwright  # seeded from the image; survives a rebuild
    depends_on: [api]

  # torch lives in this image, not in api
  trainer:
    container_name: mahjong-trainer
    profiles: ["ml"]
    build:
      context: ./server
      target: ml
    command: uv run python -m ml.train --config ml/configs/danger.yaml
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mahjong}:${POSTGRES_PASSWORD:-mahjong}@postgres:5432/${POSTGRES_DB:-mahjong}
      PYTHONPATH: /app
    # no source bind mount: the ml image's baked venv (torch) stays intact.
    # rebuild (`make train`) to pick up source changes.
    volumes:
      - ./data:/data                  # game record shards, checkpoints
    depends_on:
      postgres: {condition: service_healthy}
    # gpu:
    # deploy:
    #   resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}

  arena:
    container_name: mahjong-arena
    profiles: ["tools"]
    build:
      context: ./server
      target: ml
    command: uv run python -m bots.arena --a FaanBot --b EfficiencyBot --games 20000 --parallel 8
    environment:
      PYTHONPATH: /app
    # no source bind mount: keeps the ml image's baked venv (torch) intact. see `trainer`.
    volumes:
      - ./data:/data

volumes:
  pgdata:
  server-venv:
  playwright-browsers:
